[tool.ruff]
line-length = 127
target-version = "py311"
extend-exclude = [".git", ".idea", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402", "I001"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["app.py", "src/api/routes.py", "src/document_ocr/business_document", "src/document_ocr/text_extraction.py"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
